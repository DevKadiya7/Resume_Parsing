[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["alembic/", "tests/", ".venv/"]

[[tool.mypy.overrides]]
module = ["fitz", "dateparser", "spacy", "slowapi", "slowapi.*"]
ignore_missing_imports = true

# pytest config lives in pytest.ini (not duplicated here — pytest.ini takes
# precedence over pyproject.toml when both are present, so a second copy
# here would be silently ignored).
